<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco-Water Purifier – Pertemuan 1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#dff4f7;--bg2:#b9e3ea;--card:rgba(255,255,255,.82);--tx:#10303a;--mut:#4d6d76;--pri:#0b7b8a;--pri2:#c9ecf0;--acc:#f2a93b;--bd:rgba(11,123,138,.25);--warn:#fff1d6;--ok:#d5f3e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1a1f;--bg2:#0f3a45;--card:rgba(22,45,52,.85);--tx:#e8f4f6;--mut:#9fbdc4;--pri:#4cc9d6;--pri2:#1c4650;--bd:rgba(76,201,214,.3);--warn:#3b3020;--ok:#1d4030}}
:root[data-theme="dark"]{--bg1:#0b1a1f;--bg2:#0f3a45;--card:rgba(22,45,52,.85);--tx:#e8f4f6;--mut:#9fbdc4;--pri:#4cc9d6;--pri2:#1c4650;--bd:rgba(76,201,214,.3);--warn:#3b3020;--ok:#1d4030}
html,body{height:100%;margin:0;overflow:hidden}
*{box-sizing:border-box}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);font:clamp(14px,1.6vmin + 8px,26px)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;padding:8px 12px 0;gap:8px;position:relative}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.18);pointer-events:none;animation:rise 14s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-110vh)}}
header{display:flex;align-items:center;gap:10px;z-index:2}
header .logo{font-size:1.8em}
header h1{font-size:1.05em;margin:0;line-height:1.15}
header small{color:var(--mut);display:block;font-size:.72em}
header button{margin-left:auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;z-index:2}
.pc{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center;gap:10px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:clamp(10px,2vmin,26px);backdrop-filter:blur(6px)}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:999px;padding:2px 12px;font-size:.72em;font-weight:700;letter-spacing:.04em}
h2{font-size:1.35em;margin:.3em 0}
p{margin:.3em 0}
.big{font-size:1.25em;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(120px,22vmin,260px),1fr));gap:10px}
.tile{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:clamp(8px,1.8vmin,22px) 8px;font:inherit;cursor:pointer;text-align:center;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile.on{border-color:var(--pri);background:var(--pri2);transform:scale(1.03)}
.tile.done{background:var(--ok);border-color:#2fa56a}
.em{display:block;font-size:2.1em;line-height:1.1}
.det{background:var(--pri2);border-radius:14px;padding:clamp(8px,1.6vmin,20px);min-height:3.2em}
.warn{background:var(--warn);border-left:5px solid var(--acc);border-radius:12px;padding:8px 12px;font-size:.9em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-aspect-ratio:1/1){.two{grid-template-columns:1fr}}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.chain span{background:var(--pri2);border-radius:10px;padding:6px 10px}
.chain .cur{background:var(--acc);color:#222;font-weight:700}
ul{margin:.3em 0;padding-left:1.2em}li{margin:.2em 0}
.q{border:2px dashed var(--bd);border-radius:16px;padding:12px;cursor:pointer;background:var(--card)}
.q .a{display:none;margin-top:8px;padding:8px;border-radius:10px;background:var(--pri2);font-size:.92em}
.q.open .a{display:block}.q.open{border-style:solid;border-color:var(--pri)}
.hero{background:linear-gradient(135deg,var(--acc),#f6c46d);color:#2a1d05;border:0}
.media{flex:1;min-height:0;display:flex}
video,.scene{width:100%;max-height:100%;border-radius:16px;background:#000;object-fit:contain}
.scene{background:none}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:120px;border:1px solid var(--bd);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--tx);font:inherit}
.btn{border:1px solid var(--bd);background:var(--pri);color:#fff;border-radius:10px;padding:7px 12px;font:inherit;cursor:pointer}
.btn.o{background:var(--card);color:var(--tx)}
.layers{display:flex;flex-direction:column;border:3px solid var(--bd);border-radius:6px 6px 26px 26px;overflow:hidden}
.layers button{border:0;padding:clamp(8px,2vmin,22px) 6px;font:inherit;font-weight:700;cursor:pointer;border-bottom:1px solid rgba(0,0,0,.15)}
.layers button.on{box-shadow:inset 0 0 0 4px var(--pri)}
.cup{width:44px;height:52px;border:3px solid var(--bd);border-top:0;border-radius:0 0 10px 10px;background:#a98a56;display:inline-block;vertical-align:middle;margin-left:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl button{width:2.4em;height:2.4em;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.1em;cursor:pointer}
.ctl button:disabled{opacity:.3}
.dots{display:flex;gap:7px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--pri);transform:scale(1.4)}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;z-index:2;padding-bottom:6px}
nav button{border:0;background:var(--card);color:var(--mut);border-radius:14px;padding:6px 2px;font:inherit;font-size:.72em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.15}
nav button b{font-size:1.9em;font-weight:400}
nav button.on{background:var(--pri);color:#fff;font-weight:700}
.opt{display:flex;gap:8px;flex-wrap:wrap}
.opt .btn.good{background:#2fa56a}.opt .btn.bad{background:#c0562f}

#splash{position:fixed;inset:0;z-index:100;background:#0b3a4a;display:flex;align-items:center;justify-content:center;transition:opacity .6s,visibility .6s}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}

let t=0,p=0;
T.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${x.e}</b>${x.n}`;b.onclick=()=>{t=i;p=0;draw()};$('nav').append(b)});
function draw(dir){
 const L=T[t].p.length;
 $('stage').innerHTML=`<div class="pc" id="pc">${T[t].p[p]()}</div><div class="ctl"><button id="pv" ${p==0?'disabled':''} aria-label="Sebelumnya">◀</button><div class="dots">${T[t].p.map((_,i)=>`<i class="${i==p?'on':''}"></i>`).join('')}</div><button id="nx" ${p==L-1?'disabled':''} aria-label="Berikutnya">▶</button></div>`;
 [...$('nav').children].forEach((b,i)=>b.classList.toggle('on',i==t));
 $('pv').onclick=()=>step(-1);$('nx').onclick=()=>step(1);
 const f=$('f');if(f)f.onchange=e=>{const v=e.target.files[0];if(v){$('vid').src=URL.createObjectURL(v);$('vid').hidden=false;$('scn').style.display='none'}};
 const g=$('go');if(g)g.onclick=()=>{let u=$('url').value.trim();if(u){if(!/^https?:\/\//i.test(u))u='https://'+u;window.open(u,'_blank','noopener')}};
 const hm=$('home');if(hm)hm.onclick=()=>{ac();SFX.start();t=0;p=0;draw();$('splash').classList.remove('off')};
 const pr=$('pour');if(pr)pr.onclick=()=>{const c=$('cup');c.style.transition='none';c.style.background='#a98a56';void c.offsetWidth;c.style.transition='background 1.6s';c.style.background='#cfe9ee'};
}
function step(d){const n=p+d;if(n>=0&&n<T[t].p.length){p=n;draw()}}
$('stage').addEventListener('click',e=>{
 const k=e.target.closest('[data-k]');
 if(k){const i=+k.dataset.i,K=k.dataset.k;k.parentElement.querySelectorAll('[data-k]').forEach(x=>x.classList.remove('on'));k.classList.add('on');$('det').innerHTML='<b>'+D[K][i][1]+'</b><br>'+(K=='lay'?D[K][i][2]:D[K][i][2]);return}
 const c=e.target.closest('[data-c]');
 if(c){c.classList.toggle('done');$('prog').textContent=document.querySelectorAll('#chk .done').length+' / 4 dipahami';return}
 const a=e.target.closest('[data-a]');
 if(a){const r=a.closest('.card').querySelector('.r');a.classList.add(a.dataset.a=='1'?'good':'bad');r.textContent=a.dataset.a=='1'?'✅ Benar!':'❌ Coba lagi.'}
});
let sx=0;
$('stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)step(d<0?1:-1)});
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1)});
$('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
for(let i=0;i<7;i++){const b=document.createElement('div');b.className='bub';const s=14+Math.random()*40;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:100%;animation-duration:${10+Math.random()*12}s;animation-delay:-${Math.random()*10}s`;$('app').append(b)}
draw();

let AC=null,muted=false;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function tone(f1,f2,d,t0,v,type){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.25,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+d+.05)}
const SFX={
 tap:()=>tone(500,900,.12,0,.22),
 nav:()=>tone(700,520,.1,0,.16,'triangle'),
 good:()=>{tone(523,523,.14,0,.2);tone(784,784,.22,.12,.2)},
 bad:()=>tone(220,150,.3,0,.2,'sawtooth'),
 start:()=>{[0,.1,.2,.32,.46].forEach((t,i)=>tone(400+i*160,700+i*220,.2,t,.22));tone(1046,1568,.5,.6,.2)}};
document.addEventListener('click',e=>{
 if(e.target.closest('#start')||e.target.closest('#mu'))return;
 if(e.target.closest('[data-a]')){const g=e.target.closest('[data-a]').dataset.a=='1';SFX[g?'good':'bad']();return}
 if(e.target.closest('nav button,.ctl button'))return SFX.nav();
 if(e.target.closest('button,.q,.tile'))SFX.tap()});
$('start').onclick=()=>{ac();SFX.start();$('splash').classList.add('off')};
document.querySelector('header .logo').onclick=()=>{ac();$('splash').classList.remove('off')};
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊'};
</script>
